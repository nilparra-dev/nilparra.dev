name: Bug report
description: Something in the desktop does not work as expected
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, what you saw and the steps to reproduce it.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 141, Chrome 139…
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors or anything that makes the problem easier to reproduce.
    validations:
      required: false
