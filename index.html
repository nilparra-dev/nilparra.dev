<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- `max-image-preview:large` is what allows a full-width thumbnail in Google. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <title>Nil Parra Luna · Sistemas y redes (ASIX) · Portfolio</title>
    <meta
      name="description"
      content="Nil Parra Luna, estudiante de ASIX en Blanes: proyectos de sistemas, datos y machine learning en un escritorio interactivo que recrea Windows 95."
    />
    <meta name="author" content="Nil Parra Luna" />
    <meta name="theme-color" content="#c0c0c0" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!--
      Content-Security-Policy. GitHub Pages cannot send response headers, so
      the meta element is the only delivery channel and frame-ancestors cannot
      be expressed in it (the frame guard in main.tsx covers that hole).
      Allowed sources, nothing else:
        - 'self' and blob: for images, media and frames: the virtual disk serves
          imported files and PDFs through object URLs of our own origin.
        - https://api.tavily.com: the keyless search endpoint of the Internet
          window, the only cross-origin fetch the site makes.
        - https: for frame-src: the Internet window embeds real third-party
          sites, which by definition have no known fixed host list.
        - 'unsafe-inline' styles: the generated stylesheets and the inline
          style attributes of the shell need it; there is no other inline
          script, so script-src stays strict ('self' only).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://api.tavily.com; frame-src https: blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />

    <!--
      Absolute addresses (canonical, og:url, og:image) cannot be built from the
      base path: search engines and social networks need the scheme and the
      host. The site URL and the structured data are injected at build time by
      the seo plugin of vite.config.ts, the only place where the domain lives.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nil Parra Luna" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="ca_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Nil Parra Luna · Sistemas y redes (ASIX) · Portfolio" />
    <meta
      property="og:description"
      content="Nil Parra Luna, estudiante de ASIX en Blanes: proyectos de sistemas, datos y machine learning en un escritorio interactivo que recrea Windows 95."
    />
    <meta property="og:image" content="%SITE_URL%/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Escritorio de Windows 95 con el portfolio de Nil Parra Luna: ventanas, iconos y una partida de Solitario abierta."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image:alt"
      content="Escritorio de Windows 95 con el portfolio de Nil Parra Luna: ventanas, iconos y una partida de Solitario abierta."
    />

    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Nil Parra" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    %STRUCTURED_DATA%
  </head>
  <body>
    <!--
      Plain HTML copy of the portfolio for link previews, crawlers that do not
      run scripts and visitors without JavaScript. The seo plugin writes it
      from src/core/content/ and React replaces it when the desktop mounts.
    -->
    <div id="root">%STATIC_PROFILE%</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
