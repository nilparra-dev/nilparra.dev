name: CI

# Type check, tests and the production build for pull requests and for main.
# Main is protected: changes land through pull requests, so this is the check
# to look at before merging.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit: tags are mutable, a compromised tag would run code
      # inside CI. Dependabot keeps the pins up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      # The runtime renders every piece of data as text (see docs/security.md);
      # this grep fails the build if that rule is ever broken by accident.
      - name: Reject unsafe DOM and evaluation patterns
        run: |
          if grep -RInE 'dangerouslySetInnerHTML|innerHTML|document\.write|new Function|\beval\(' src; then
            echo '::error::Unsafe DOM or evaluation pattern found in src/'
            exit 1
          fi

      - name: Type check and tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      # Validates wrangler.jsonc and the assets it would upload, without
      # credentials and without publishing anything.
      - name: Check the Cloudflare deployment
        run: npx wrangler deploy --dry-run
