name: Deploy to GitHub Pages

# Builds the static site and publishes it on GitHub Pages.
#
#   - Project site (https://<user>.github.io/<repo>/)  -> BASE_PATH is set to
#     "/<repo>/" automatically.
#   - User site or custom domain (https://example.com/) -> set BASE_PATH to "/"
#     editing the env block below (or add a repository variable named BASE_PATH).
#
# The site is fully static: no backend, no secrets, no server side rendering.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build
        env:
          # Vite reads VITE_BASE; BASE_PATH keeps the workflow readable.
          VITE_BASE: ${{ env.BASE_PATH }}

      # Reloading a deep link on Pages must not 404: the app is a single page,
      # so index.html answers for unknown paths as well.
      - name: Add the SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
