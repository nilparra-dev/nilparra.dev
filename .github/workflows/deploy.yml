name: Deploy to GitHub Pages

# Manual publish to GitHub Pages: Actions -> Deploy to GitHub Pages -> Run
# workflow. Nothing is published automatically while the repository stays
# private and the site is not meant to be public yet.
#
#   - To deploy on every push to main again, restore this trigger:
#
#       on:
#         push:
#           branches: [main]
#         workflow_dispatch:
#
#   - Custom domain (the current setup, https://nilparra.dev/) -> BASE_PATH and
#     SITE_URL default to the custom domain through public/CNAME. The domain
#     must also be configured in Settings -> Pages so GitHub can issue the
#     certificate and enforce HTTPS.
#   - Project site (https://<user>.github.io/<repo>/) -> set the repository
#     variable BASE_PATH to "/<repo>/" and SITE_URL to the full project URL, so
#     the canonical address and the structured data keep pointing at the real
#     domain instead of the preview one.
#
# The site is fully static: no backend, no secrets, no server side rendering.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://nilparra.dev' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build
        env:
          # Vite reads VITE_BASE and VITE_SITE_URL; the BASE_PATH/SITE_URL names
          # keep the workflow readable.
          VITE_BASE: ${{ env.BASE_PATH }}
          VITE_SITE_URL: ${{ env.SITE_URL }}

      # Reloading a deep link on Pages must not 404: the app is a single page,
      # so index.html answers for unknown paths as well. Pages still answers
      # with a 404 status, so the copy is marked noindex: it must never be
      # indexed as a second copy of the landing page.
      - name: Add the SPA fallback
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('dist/index.html','utf8');fs.writeFileSync('dist/404.html',html.replace('</head>','<meta name=\"robots\" content=\"noindex\" /></head>'))"
          touch dist/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
