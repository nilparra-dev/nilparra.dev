name: Deploy to Cloudflare

# Publishes to Cloudflare Workers (static assets) on every push to main, that
# is, on every merged pull request. It can also be run by hand to redeploy:
# Actions -> Deploy to Cloudflare -> Run workflow. Deploys queue instead of
# cancelling each other, so the last push always ends up published.
#
# wrangler.jsonc says what is served and on which domain; public/_headers
# carries the security and cache headers. The site is fully static: no
# backend and no Worker script.
#
# Credentials live in the "production" environment of the repository, which
# only accepts deployments from main, so only this job can read them:
#   - CLOUDFLARE_API_TOKEN: a token limited to "Edit Cloudflare Workers" on
#     the account and the nilparra.dev zone.
#   - CLOUDFLARE_ACCOUNT_ID: the account that owns the Worker.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nilparra.dev/
    steps:
      # Pinned by commit: tags are mutable, a compromised tag would run code
      # inside CI next to the deploy token. Dependabot keeps the pins up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build
        env:
          # The SITE_URL repository variable overrides the canonical domain of
          # vite.config.ts; routes in wrangler.jsonc must then change with it.
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://nilparra.dev' }}

      # wrangler comes from the lockfile, like every other tool of the build.
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
