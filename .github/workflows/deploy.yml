name: Deploy to GitHub Pages

# Manual publish to GitHub Pages: Actions -> Deploy to GitHub Pages -> Run
# workflow. Nothing is published automatically until the site is launched.
#
#   - To deploy on every push to main, restore this trigger:
#
#       on:
#         push:
#           branches: [main]
#         workflow_dispatch:
#
#   - Custom domain (the current setup, https://nilparra.dev/) -> nothing to
#     set: BASE_PATH and SITE_URL fall back to "/" and https://nilparra.dev in
#     the env block below, and public/CNAME carries the domain into the
#     artifact. The domain must also be configured in Settings -> Pages so
#     GitHub can issue the certificate and enforce HTTPS.
#   - Project site (https://<owner>.github.io/<repo>/) -> set the repository
#     variables BASE_PATH to "/<repo>/" and SITE_URL to that address, so the
#     canonical URL, the social tags and the structured data match where the
#     site is really served.
#
# The site is fully static: no backend, no secrets, no server side rendering.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://nilparra.dev' }}
    steps:
      # Pinned by commit: tags are mutable, a compromised tag would run code
      # inside CI with pages permissions. Dependabot keeps the pins up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build
        env:
          # Vite reads VITE_BASE and VITE_SITE_URL; the BASE_PATH/SITE_URL names
          # keep the workflow readable.
          VITE_BASE: ${{ env.BASE_PATH }}
          VITE_SITE_URL: ${{ env.SITE_URL }}

      # Reloading a deep link on Pages must not 404: the app is a single page,
      # so index.html answers for unknown paths as well. Pages still answers
      # with a 404 status, so the copy is marked noindex: it must never be
      # indexed as a second copy of the landing page.
      - name: Add the SPA fallback
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('dist/index.html','utf8');fs.writeFileSync('dist/404.html',html.replace('</head>','<meta name=\"robots\" content=\"noindex\" /></head>'))"
          touch dist/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
